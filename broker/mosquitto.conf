# Mosquitto de Vitalify: por aquí pasan los datos del wearable hacia el backend.
#
#   ESP32 (usuario = código del dispositivo) ──publica──> device/<codigo>/telemetria  (QoS 1)
#   backend (usuario vitalify-backend)       <──lee──────  device/+/telemetria
#
# Sin clientes anónimos: cada uno entra con usuario y clave (los crea iniciar.sh desde .env)
# y el ACL limita qué tópicos puede usar.

listener 1883
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Los mensajes retenidos ("online"/"offline") y los QoS 1 pendientes sobreviven a un reinicio.
# Si el backend se conecta con sesión persistente (clean session = false), el broker le guarda
# lo que llegue mientras está caído.
persistence true
persistence_location /mosquitto/data/
max_queued_messages 1000

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
